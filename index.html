  
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <main class="w-full max-w-sm bg-white p-6 rounded-2xl shadow">

    <h1 class="text-2xl font-bold mb-2">
      Chat
    </h1>

    <p class="text-gray-500 mb-6">
      Entre para falar conosco.
    </p>

    <button
      id="entrar"
      class="w-full bg-black text-white py-3 rounded-xl"
    >
      Entrar
    </button>

    <div
      id="status"
      class="mt-4 text-sm text-gray-500 text-center"
    >
      Pronto.
    </div>

  </main>


  <script type="module">

    // =====================================================
    // FIREBASE
    // =====================================================

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    // =====================================================
    // CREDENCIAIS FIREBASE
    // =====================================================

    const firebaseConfig = {

  apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
  authDomain: "myops-d7525.firebaseapp.com",
  projectId: "myops-d7525",
  storageBucket: "myops-d7525.firebasestorage.app",
  messagingSenderId: "247824192162",
  appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"

    };


    // =====================================================
    // UID DO GESTOR
    // =====================================================

    const GESTOR_UID =
      "COLOQUE_SEU_UID_AQUI";


    // =====================================================
    // FIREBASE
    // =====================================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    const entrar =
      document.getElementById("entrar");

    const status =
      document.getElementById("status");


    // =====================================================
    // ENTRAR
    // =====================================================

    entrar.onclick = async () => {

      try {

        entrar.disabled = true;

        entrar.textContent =
          "Entrando...";

        status.textContent =
          "Conectando...";


        // Login anônimo
        const resultado =
          await signInAnonymously(auth);


        const user =
          resultado.user;


        // =================================================
        // CADASTRO BÁSICO DO USUÁRIO
        // =================================================

        await setDoc(
          doc(
            db,
            "users",
            user.uid
          ),
          {

            uid:
              user.uid,

            name:
              "Usuário",

            role:
              "user",

            lastLogin:
              serverTimestamp(),

            createdAt:
              serverTimestamp()

          },
          {
            merge: true
          }
        );


        status.textContent =
          "Abrindo conversa...";


        // =================================================
        // IR DIRETO PARA O CHAT
        // =================================================

        window.location.href =
          "chat.html";

      }

      catch (error) {

        console.error(error);

        entrar.disabled = false;

        entrar.textContent =
          "Entrar";

        status.innerHTML = `
          <span class="text-red-500">
            ${error.message}
          </span>
        `;

      }

    };

  </script>

</body>

</html>
