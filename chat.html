  
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conversa</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <main class="max-w-md mx-auto h-screen bg-white flex flex-col">

    <!-- TOPO -->
    <header class="p-4 border-b">

      <h1 class="font-bold">
        Atendimento
      </h1>

      <p
        id="status"
        class="text-xs text-gray-400"
      >
        Conectando...
      </p>

    </header>


    <!-- MENSAGENS -->
    <section
      id="mensagens"
      class="flex-1 overflow-y-auto p-4 space-y-2"
    ></section>


    <!-- ENVIO -->
    <form
      id="form"
      class="p-3 border-t flex gap-2"
    >

      <input
        id="texto"
        type="text"
        placeholder="Digite uma mensagem..."
        autocomplete="off"
        class="flex-1 border rounded-xl px-3 py-3 outline-none"
      >

      <button
        class="bg-black text-white px-4 rounded-xl"
      >
        Enviar
      </button>

    </form>

  </main>


  <script type="module">

    // =====================================================
    // FIREBASE
    // =====================================================

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      addDoc,
      updateDoc,
      collection,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    // =====================================================
    // CREDENCIAIS FIREBASE
    // =====================================================

    const firebaseConfig = {

  apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
  authDomain: "myops-d7525.firebaseapp.com",
  projectId: "myops-d7525",
  storageBucket: "myops-d7525.firebasestorage.app",
  messagingSenderId: "247824192162",
  appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"

    };


    // =====================================================
    // UID DO GESTOR
    // =====================================================

    const GESTOR_UID =
      "COLOQUE_SEU_UID_AQUI";


    // =====================================================
    // FIREBASE
    // =====================================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const mensagens =
      document.getElementById("mensagens");

    const texto =
      document.getElementById("texto");

    const form =
      document.getElementById("form");

    const status =
      document.getElementById("status");


    // =====================================================
    // INICIAR
    // =====================================================

    async function iniciar() {

      try {

        // Login anônimo
        const resultado =
          await signInAnonymously(auth);

        const user =
          resultado.user;


        // =================================================
        // USUÁRIO
        // =================================================

        await setDoc(
          doc(
            db,
            "users",
            user.uid
          ),
          {

            uid:
              user.uid,

            name:
              "Usuário",

            role:
              "user",

            lastLogin:
              serverTimestamp()

          },
          {
            merge: true
          }
        );


        // =================================================
        // ID FIXO DA CONVERSA
        // =================================================

        const ids = [
          user.uid,
          GESTOR_UID
        ].sort();


        const conversaId =
          ids.join("_");


        const conversaRef =
          doc(
            db,
            "conversations",
            conversaId
          );


        // =================================================
        // CRIAR CONVERSA
        // =================================================

        await setDoc(
          conversaRef,
          {

            participants:
              ids,

            userId:
              user.uid,

            gestorId:
              GESTOR_UID,

            lastMessage:
              "",

            updatedAt:
              serverTimestamp()

          },
          {
            merge: true
          }
        );


        status.textContent =
          "Online";


        // =================================================
        // MENSAGENS
        // =================================================

        const mensagensRef =
          collection(
            db,
            "conversations",
            conversaId,
            "messages"
          );


        const q =
          query(
            mensagensRef,
            orderBy(
              "createdAt",
              "asc"
            )
          );


        onSnapshot(
          q,
          (snapshot) => {

            mensagens.innerHTML = "";


            snapshot.forEach(
              (messageDoc) => {

                const mensagem =
                  messageDoc.data();


                const minha =
                  mensagem.senderId ===
                  user.uid;


                const item =
                  document.createElement("div");


                item.className =
                  minha
                    ? "flex justify-end"
                    : "flex justify-start";


                item.innerHTML = `

                  <div
                    class="
                      max-w-[75%]
                      px-4 py-2
                      rounded-2xl
                      ${
                        minha
                          ? "bg-black text-white"
                          : "bg-gray-200"
                      }
                    "
                  >
                    ${mensagem.text || ""}
                  </div>

                `;


                mensagens.appendChild(item);

              }
            );


            mensagens.scrollTop =
              mensagens.scrollHeight;

          }
        );


        // =================================================
        // ENVIAR MENSAGEM
        // =================================================

        form.onsubmit =
          async (event) => {

            event.preventDefault();


            const valor =
              texto.value.trim();


            if (!valor) return;


            texto.value = "";


            try {

              await addDoc(
                mensagensRef,
                {

                  text:
                    valor,

                  senderId:
                    user.uid,

                  createdAt:
                    serverTimestamp()

                }
              );


              await updateDoc(
                conversaRef,
                {

                  lastMessage:
                    valor,

                  updatedAt:
                    serverTimestamp()

                }
              );


            } catch (error) {

              console.error(error);

              alert(
                error.message
              );

            }

          };


      } catch (error) {

        console.error(error);

        status.textContent =
          "Erro";

        alert(
          error.message
        );

      }

    }


    iniciar();

  </script>

</body>

</html>
