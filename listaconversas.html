<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conversas</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <div class="max-w-2xl mx-auto p-4">

    <header class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900">
        Conversas
      </h1>

      <p class="text-sm text-gray-500">
        Atendimento
      </p>
    </header>

    <div id="status" class="text-sm text-gray-500 mb-4">
      Conectando...
    </div>

    <div id="lista" class="space-y-3"></div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    // =====================================================
    // FIREBASE
    // =====================================================

    const firebaseConfig = {
    apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
  authDomain: "myops-d7525.firebaseapp.com",
  projectId: "myops-d7525",
  storageBucket: "myops-d7525.firebasestorage.app",
  messagingSenderId: "247824192162",
  appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"
    };


    // =====================================================
    // UID DO GESTOR
    // =====================================================

    const GESTOR_UID = "COLOQUE_SEU_UID_AQUI";


    // =====================================================
    // FIREBASE
    // =====================================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const status = document.getElementById("status");
    const lista = document.getElementById("lista");


    // =====================================================
    // LISTA EM TEMPO REAL
    // =====================================================

    function ouvirConversas() {

      const q = query(
        collection(db, "conversations"),
        where("gestorId", "==", GESTOR_UID)
      );


      onSnapshot(
        q,

        snapshot => {

          const conversas = [];


          snapshot.forEach(doc => {

            conversas.push({
              id: doc.id,
              ...doc.data()
            });

          });


          // Mais recente primeiro
          conversas.sort((a, b) => {

            const aTime = a.updatedAt?.seconds || 0;
            const bTime = b.updatedAt?.seconds || 0;

            return bTime - aTime;

          });


          lista.innerHTML = "";


          if (conversas.length === 0) {

            status.textContent =
              "Nenhuma conversa ainda.";

            return;
          }


          status.textContent =
            `${conversas.length} conversa(s)`;


          conversas.forEach(conversa => {

            const item = document.createElement("a");

            item.href =
              `chat.html?id=${encodeURIComponent(conversa.id)}`;

            item.className = `
              block
              bg-white
              border
              border-gray-200
              rounded-2xl
              p-4
              hover:bg-gray-50
              transition
            `;


            const nome =
              conversa.userName || "Usuário";


            const ultimaMensagem =
              conversa.lastMessage ||
              "Nenhuma mensagem ainda";


            item.innerHTML = `

              <div class="flex items-center justify-between gap-4">

                <div class="min-w-0">

                  <div class="font-semibold text-gray-900">
                    ${nome}
                  </div>

                  <div class="text-sm text-gray-500 truncate mt-1">
                    ${ultimaMensagem}
                  </div>

                </div>

                <div class="text-gray-400">
                  →
                </div>

              </div>

            `;


            lista.appendChild(item);

          });

        },


        error => {

          console.error(error);

          status.textContent =
            "Erro na conexão com o Firebase.";

        }

      );

    }


    // =====================================================
    // AUTENTICAÇÃO
    // =====================================================

    onAuthStateChanged(auth, user => {

      if (user) {

        ouvirConversas();

      }

    });


    signInAnonymously(auth);

  </script>

</body>
</html>
